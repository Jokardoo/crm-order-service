
volumes:
  minio-data:
    driver: local

services:
  app:
    build:
      context: .
    container_name: orderservice
    depends_on:
      - minio

    env_file:
      - .env

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server ~/minio --console-address :9090
    ports:
      - '9090:9090'
      - '9000:9000'
    volumes:
      - minio-data:/minio

  # Zookeeper - необходим для управления кластером Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0  # Официальный образ Zookeeper
    container_name: zookeeper  # Имя контейнера для удобства
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181  # Порт для подключения клиентов
      ZOOKEEPER_TICK_TIME: 2000    # Время тика для heartbeat
    ports:
      - "2181:2181"  # Пробрасываем порт на хост
    networks:
      - kafka-network  # Подключаем к сети Kafka

  kafka:
    image: confluentinc/cp-kafka:7.5.0  # Официальный образ Kafka
    container_name: kafka
    depends_on:
      - zookeeper  # Зависимость от Zookeeper
    ports:
      - "9092:9092"  # Порт для подключения продюсеров/консьюмеров
    environment:
      KAFKA_BROKER_ID: 1  # Уникальный ID брокера в кластере
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181  # Подключение к Zookeeper
      # Адрес, по которому брокер доступен для клиентов
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      # Фактор репликации для топика смещений (для прода - минимум 3)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Автоматическое создание топиков при первом обращении
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - kafka-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka  # Зависит от Kafka
    ports:
      - "8090:8090"  # Web интерфейс будет доступен на порту 8080
    environment:
      # Конфигурация кластера Kafka

      KAFKA_CLUSTERS_0_NAME: local  # Имя кластера
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092  # Адреса брокеров
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181  # Адрес Zookeeper
    networks:
      - kafka-network

# Создаем отдельную сеть для изоляции сервисов Kafka
networks:
  kafka-network:
    driver: bridge  # Тип сети - bridge