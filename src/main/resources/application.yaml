spring:
  application:
    name: order-service
  config:
    import:
      # optional:file... для того, чтобы можно было доставать проперти из файла .env
      - "configserver:http://localhost:8071"
      - "optional:file:.env[.properties]"


  kafka:
    ui:
      url: http://localhost:8090
      topics:
        orders: orders-topic
        notifications: notifications-topic
        users: users-topic
    # Адреса Kafka брокеров для подключения
    bootstrap-servers: localhost:9092

    producer:
      # Сериализаторы для ключей и значений
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        enable.idempotence: true
        # Гарантирует записи на все реплики
        acks: all
        retries: 2147483647  # Integer.MAX_VALUE
        max.in.flight.requests.per.connection: 5
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000







