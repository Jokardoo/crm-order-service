logging:
  level:
    org:
      springdoc: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
management:
  endpoints:
    web:
      exposure:
        include: "*"

minio:
  bucket: ${MINIO_BUCKET:images}
  url: ${MINIO_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}


